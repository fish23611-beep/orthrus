# Stateless non-graph Semantic MLP baseline.
pipeline:
  mode: detection_only
  run_tracing: false
model:
  variant: orthrus_baseline
logging:
  wandb_mode: disabled
detection:
  gnn_training:
    encoder:
      backbone: semantic_mlp
      context:
        mode: none
        multiscale:
          enabled: false
    decoder:
      predict_edge_type:
        enabled: true
      time_gap:
        enabled: false
        lambda_time: 0.3
        hidden_dim: 128
        num_classes: 6
