# Single-window 24-neighbor control.
# Uses Q99 as upper bound for the time window, max 24 neighbors.
# This is distinct from canonical multi-scale (Q50/Q90/unbounded).
pipeline:
  mode: detection_only
  run_tracing: false
model:
  variant: mstc
experiment_identity:
  semantics_version: temporal_v2
logging:
  wandb_mode: disabled
detection:
  gnn_training:
    encoder:
      backbone: graph_transformer
      context:
        mode: single_window
        multiscale:
          enabled: true
          candidate_capacity: 64
          history_device: cpu
          scale_quantiles: [0.50, 0.90, 0.99]
          neighbor_budgets: [24]
          share_encoder: true
          fusion: equal
          use_scale_embedding: false
          gate_hidden_dim: 64
    decoder:
      predict_edge_type:
        enabled: true
      time_gap:
        enabled: true
        lambda_time: 0.3
        hidden_dim: 128
        num_classes: 6
calibration:
  method: hierarchical_relation
node_aggregation:
  method: topk_mean
  topk: 5
  include_dst: true
  score_field: score_calibrated
node_threshold:
  method: validation_quantile
  quantile: 0.999
dataset_view:
  mode: host_network_full
