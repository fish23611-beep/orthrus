# C3 time-gap statistics config
# Computes per-node inter-event time-bucket statistics from training data
# and persists bucket boundaries for use by TimeGapStatistics.
#
# This config does NOT enable TimeGapDecoder (C4 scope).

time_gap:
  # Quantiles used to define the five time-gap buckets
  # (NO_HISTORY=0, VERY_SHORT=1, SHORT=2, MEDIUM=3, LONG=4, VERY_LONG=5).
  # Boundaries are computed in log1p(seconds) space from training intervals only.
  time_bucket_quantiles: [0.2, 0.4, 0.6, 0.8]

  # Quantiles used to define the three scale boundaries (Q50 / Q90 / Q99).
  # Boundaries are computed in log1p(seconds) space from training intervals only.
  scale_quantiles: [0.5, 0.9, 0.99]

  # Path (relative to run artifact root) where bucket statistics are persisted.
  metadata_path: metadata/time_statistics.json
