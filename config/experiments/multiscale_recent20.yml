# Original ORTHRUS-style Recent-20 reference (not a fair 24-budget control).
pipeline:
  mode: detection_only
  run_tracing: false
model:
  variant: mstc
experiment_identity:
  semantics_version: temporal_v2
logging:
  wandb_mode: disabled
detection:
  gnn_training:
    encoder:
      backbone: graph_transformer
      neighbor_size: 20
      context:
        mode: recent
        multiscale:
          enabled: false
    decoder:
      predict_edge_type:
        enabled: true
      time_gap:
        enabled: true
        lambda_time: 0.3
        hidden_dim: 128
        num_classes: 6
calibration:
  method: hierarchical_relation
node_aggregation:
  method: topk_mean
  topk: 5
  include_dst: true
  score_field: score_calibrated
node_threshold:
  method: validation_quantile
  quantile: 0.999
dataset_view:
  mode: host_network_full
